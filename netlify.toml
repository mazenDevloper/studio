# Netlify build for the Next.js app (cplay3.netlify.app)
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Madar (mazendevloper.github.io) reads today's matches for its live island.
[[headers]]
  for = "/api/matches*"
  [headers.values]
    Access-Control-Allow-Origin = "https://mazendevloper.github.io"
    Vary = "Origin"
