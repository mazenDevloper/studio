# The iPhone app (XcodeGen: `xcodegen generate` makes DriveCast.xcodeproj). The site in a native shell, with Live
# Activities on the Dynamic Island: prayer / reminder countdowns (always on), favourite teams' live matches (on from
# the app's settings), a prayer widget. Built unsigned by .github/workflows/ios-ipa.yml for sideloading.
name: DriveCast
options:
  bundleIdPrefix: com.drivecast
  deploymentTarget:
    iOS: "16.2"
  developmentLanguage: ar
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
targets:
  DriveCast:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Settings.bundle
        buildPhase: resources
    entitlements:
      path: App/DriveCast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drivecast.sovereign]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DriveCast
        CFBundleDevelopmentRegion: ar
        UILaunchScreen: {}
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.drivecast.sovereign.refresh]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocationWhenInUseUsageDescription: "خريطة لوحة السيارة تعرض موقعك"
        NSMicrophoneUsageDescription: "الأوامر الصوتية والبحث بالصوت"
        NSCameraUsageDescription: "مسح الرموز داخل التطبيق"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivecast.sovereign
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: DriveCastWidgets
  DriveCastWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    entitlements:
      path: Widgets/DriveCastWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drivecast.sovereign]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: DriveCast
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drivecast.sovereign.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
