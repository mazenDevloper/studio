name: Android widget previews

# Draws every home-screen widget, the floating islands and the goal card on an emulator (PreviewRender, with today's
# real matches) and publishes the pictures as the "android-preview-shots" release, so the native look can be compared
# with the site without a phone.
on:
  push:
    branches: ["claude/**"]
    paths: ["android-app/**", ".github/workflows/android-previews.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-previews
  cancel-in-progress: true

jobs:
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Capacitor and sync the Android project
        working-directory: android-app
        run: |
          npm ci || npm install --no-audit --no-fund
          npx cap sync android

      - name: Build the app and the preview test
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee build.txt

      - name: Publish the build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android-app/android
        run: |
          tail -c 200000 build.txt > build-tail.txt
          gh release delete android-preview-shots --yes --cleanup-tag || true
          gh release create android-preview-shots build-tail.txt --target "$GITHUB_SHA" --prerelease --title "Widget previews: build failed" --notes "see build-tail.txt"

      - name: Draw the previews on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android-app/android
          script: |
            adb install -r -g app/build/outputs/apk/debug/app-debug.apk
            adb install -r -g app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.drivecast.sovereign.PreviewRender com.drivecast.sovereign.test/androidx.test.runner.AndroidJUnitRunner > instrument.txt 2>&1 || true
            adb exec-out run-as com.drivecast.sovereign tar c files/previews > previews.tar || true
            adb logcat -d -t 400 AndroidRuntime:E TestRunner:V *:S > logcat.txt 2>&1 || true

      - name: Publish the previews
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android-app/android
        run: |
          mkdir -p previews && (tar xf previews.tar -C previews || true)
          ls -laR previews || true
          cat instrument.txt || true
          FILES=$(find previews -name '*.png' | sort | tr '\n' ' ')
          for f in instrument.txt logcat.txt; do [ -s "$f" ] && FILES="$FILES $f"; done
          gh release delete android-preview-shots --yes --cleanup-tag || true
          gh release create android-preview-shots $FILES \
            --target "$GITHUB_SHA" --prerelease \
            --title "Widget previews (${GITHUB_REF_NAME} @ ${GITHUB_SHA::7})" \
            --notes "Native widgets / islands drawn on an emulator with today's matches."
