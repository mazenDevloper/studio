name: iOS IPA

# Builds the iPhone app (ios-app/, XcodeGen) unsigned and publishes it as the "ios-latest" release (DriveCast.ipa).
# Install it with Sideloadly or AltStore (they sign it with your Apple ID; a free Apple ID needs re-signing every 7
# days). The app and its widget extension are ad-hoc signed with their App Group entitlement so the installer keeps it.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["ios-app/**", ".github/workflows/ios-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Generate the Xcode project
        working-directory: ios-app
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild -project DriveCast.xcodeproj -target DriveCast -configuration Release -sdk iphoneos \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" SYMROOT="$PWD/build" build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          test -d build/Release-iphoneos/DriveCast.app
          # the same app signed by Xcode itself (ad-hoc, like a normal developer build, no App Group): the widget
          # part's signature is made by the linker/codesign together, not patched afterwards
          xcodebuild -project DriveCast.xcodeproj -target DriveCast -configuration Release -sdk iphoneos \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES CODE_SIGN_ENTITLEMENTS="" SYMROOT="$PWD/build-signed" build 2>&1 | tee build-signed.log | grep -E "error:|BUILD" || true
          # a test build: the widget alone, without the Live Activity (to tell which part iOS rejects)
          xcodebuild -project DriveCast.xcodeproj -target DriveCast -configuration Release -sdk iphoneos \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="NO_LIVE_ACTIVITY" SYMROOT="$PWD/build-test" build 2>&1 | tee build-test.log | grep -E "error:|BUILD" || true

      - name: Package the IPA
        working-directory: ios-app
        run: |
          APP=build/Release-iphoneos/DriveCast.app
          ls -la "$APP" "$APP/PlugIns" || true
          # Xcode-signed builds (the default from now on) and the widget-only test
          if [ -d build-signed/Release-iphoneos/DriveCast.app ]; then
            mkdir -p XS/Payload && cp -R build-signed/Release-iphoneos/DriveCast.app XS/Payload/ && (cd XS && zip -qry ../DriveCast-xcode.ipa Payload)
          fi
          if [ -d build-test/Release-iphoneos/DriveCast.app ]; then
            mkdir -p WT/Payload && cp -R build-test/Release-iphoneos/DriveCast.app WT/Payload/
            for ex in WT/Payload/DriveCast.app/PlugIns/*.appex; do codesign --force --sign - "$ex"; done
            codesign --force --sign - WT/Payload/DriveCast.app
            (cd WT && zip -qry ../DriveCast-widget-test.ipa Payload)
          fi
          grep -n -B2 -A4 "error:" build-signed.log build-test.log | head -80 > variant-errors.txt || true
          tail -c 4000 build-signed.log >> variant-errors.txt || true
          # the default IPA: no App Group entitlement - sideloading with a free account often can't provision one,
          # and an entitlement the profile doesn't grant stops iOS from running the widget part (no widgets, a
          # blank Dynamic Island). The widget then reads the prayer times from the cloud itself.
          mkdir -p Payload && cp -R "$APP" Payload/
          for ex in Payload/DriveCast.app/PlugIns/*.appex; do codesign --force --sign - "$ex"; done
          codesign --force --sign - Payload/DriveCast.app
          zip -qry DriveCast.ipa Payload
          # no signature at all (the sideloading tool signs every part fresh: a widget part crashing with
          # "CODESIGNING Invalid Page" points at a re-signed binary whose page hashes no longer match)
          mkdir -p NoSign/Payload && cp -R "$APP" NoSign/Payload/
          for b in NoSign/Payload/DriveCast.app/PlugIns/*.appex/DriveCastWidgets NoSign/Payload/DriveCast.app/DriveCast; do codesign --remove-signature "$b" || true; done
          rm -rf NoSign/Payload/DriveCast.app/_CodeSignature NoSign/Payload/DriveCast.app/PlugIns/*.appex/_CodeSignature
          (cd NoSign && zip -qry ../DriveCast-nosign.ipa Payload)
          # with the App Group (logos in the island) for AltStore setups that grant it
          mkdir -p Group/Payload && cp -R "$APP" Group/Payload/
          for ex in Group/Payload/DriveCast.app/PlugIns/*.appex; do codesign --force --sign - --entitlements Widgets/DriveCastWidgets.entitlements "$ex"; done
          codesign --force --sign - --entitlements App/DriveCast.entitlements Group/Payload/DriveCast.app
          (cd Group && zip -qry ../DriveCast-group.ipa Payload)
          # a "lite" copy: no widget extension, no app-group entitlement (some AltStore setups fail on those)
          mkdir -p Lite/Payload && cp -R "$APP" Lite/Payload/
          rm -rf Lite/Payload/DriveCast.app/PlugIns Lite/Payload/DriveCast.app/_CodeSignature
          codesign --force --sign - Lite/Payload/DriveCast.app
          (cd Lite && zip -qry ../DriveCast-lite.ipa Payload)
          ls -la DriveCast.ipa DriveCast-lite.ipa

      - name: Previews (every widget and island, drawn in the simulator)
        continue-on-error: true
        timeout-minutes: 15
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild -project DriveCast.xcodeproj -target Snapshots -configuration Debug -sdk iphonesimulator ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build-snap" build 2>&1 | tee build-snap.log | grep -E "error:|BUILD" || true
          APP=build-snap/Debug-iphonesimulator/Snapshots.app
          if [ ! -d "$APP" ]; then grep -n -B2 -A6 "error:" build-snap.log | head -150 > snap-errors.txt; exit 0; fi
          codesign --force --sign - "$APP" || true
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name'] and 'Pro' in x['name']))")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.drivecast.snapshots
          DATA=$(xcrun simctl get_app_container "$UDID" com.drivecast.snapshots data)
          for i in $(seq 1 90); do [ -f "$DATA/Documents/snaps/done" ] && break; sleep 2; done
          ls "$DATA/Documents/snaps" | head -80
          (cd "$DATA/Documents" && zip -qr "$GITHUB_WORKSPACE/ios-app/snapshots.zip" snaps)

      - name: Publish the build log (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios-app
        run: |
          grep -n -B2 -A6 "error:" build.log | head -300 > errors.txt || true
          tail -c 150000 build.log > build-tail.txt || true
          gh release delete ios-build-log --yes --cleanup-tag || true
          gh release create ios-build-log errors.txt build-tail.txt --target "$GITHUB_SHA" --prerelease --title "iOS build failed" --notes "see errors.txt"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ios-app
        run: |
          TAG=ios-latest
          case "$GITHUB_REF_NAME" in main) ;; *) TAG=ios-preview ;; esac
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" DriveCast.ipa $(ls DriveCast-xcode.ipa DriveCast-widget-test.ipa variant-errors.txt snapshots.zip snap-errors.txt 2>/dev/null) DriveCast-nosign.ipa DriveCast-group.ipa DriveCast-lite.ipa --target "$GITHUB_SHA" --prerelease \
            --title "DriveCast iPhone (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Unsigned: install with Sideloadly or AltStore (iOS 16.2+; the Dynamic Island needs iPhone 14 Pro or newer)."
